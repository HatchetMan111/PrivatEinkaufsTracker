[project]
name = "offers-dashboard"
version = "0.1.0"
description = "Privater Wochenangebots-Tracker fuer Proxmox LXC"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
